<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#000000"/>
  <script src="/appearance.js"></script>
  <title>Route Pilot · 暂时无法连接</title>
  <link rel="icon" href="/icons/icon-192.png"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
  <style>
    :root { color-scheme: dark; --bg: #000000; --surface: #000000; --line: #323232; --ink: #f5f5f5; --muted: #ababab; }
    :root[data-theme="light"] { color-scheme: light; --bg: #ffffff; --surface: white; --line: #dedede; --ink: #202020; --muted: #656565; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 20px; background: var(--bg); color: var(--ink); font: 14px/1.6 Manrope, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    main { width: min(100%, 380px); padding: 28px; border: 1px solid var(--line); border-radius: 24px; background: var(--surface); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 500; letter-spacing: -.04em; }
    img { width: 32px; height: 32px; border-radius: 10px; }
    h1 { margin: 28px 0 8px; font-size: 20px; font-weight: 450; }
    p { margin: 0; color: var(--muted); }
    a { display: inline-block; margin-top: 20px; padding: 8px 18px; background: var(--ink); border-radius: 24px; color: var(--bg); text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  </style>
  <script src="/offline.js" defer></script>
</head>
<body>
  <main>
    <div class="brand"><img src="/icons/icon-192.png" alt=""/>Route Pilot</div>
    <div role="status"><h1>暂时无法连接</h1><p>请检查网络，联网后自动恢复。</p></div>
    <a href="/">重试</a>
  </main>
</body>
</html>
